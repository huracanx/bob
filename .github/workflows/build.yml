name: Build 1_kej.asi

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  D3DX_VERSION: 9.29.952.8
  DXSDK_DIR: C:\DXSDK\

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # The project links against legacy D3DX9 (d3dx9.lib). Instead of the
      # huge June 2010 DirectX SDK installer, grab the official
      # Microsoft.DXSDK.D3DX NuGet package and lay it out in the
      # DXSDK-style folder tree the .vcxproj already expects.
      #
      # NOTE: only the *build-time* headers + import libs are needed here.
      # The runtime D3DX9_43.dll is NOT shipped with the mod - players are
      # expected to have the DirectX End-User Runtime (June 2010) installed.
      - name: Prepare D3DX (legacy DirectX SDK files)
        shell: pwsh
        run: |
          $url = "https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/${{ env.D3DX_VERSION }}"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\d3dx.zip"
          Expand-Archive "$env:TEMP\d3dx.zip" -DestinationPath "$env:TEMP\d3dx_pkg" -Force

          New-Item -ItemType Directory -Force -Path "${{ env.DXSDK_DIR }}Include", "${{ env.DXSDK_DIR }}Lib\x86" | Out-Null
          Copy-Item "$env:TEMP\d3dx_pkg\build\native\include\*" "${{ env.DXSDK_DIR }}Include\" -Recurse -Force
          Copy-Item "$env:TEMP\d3dx_pkg\build\native\release\lib\x86\*" "${{ env.DXSDK_DIR }}Lib\x86\" -Recurse -Force
          Write-Host "D3DX headers + x86 import libraries prepared in ${{ env.DXSDK_DIR }}"

      - name: Build (Release Win32)
        run: msbuild 1_kej.sln /m /verbosity:minimal /p:Configuration=Release /p:Platform=x86

      - name: Locate 1_kej.asi
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path . -Filter "1_kej.asi" -Recurse -File -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -notlike "*\package\*" } |
                   Select-Object -First 1
          if (-not $found) {
            Write-Host "=== 1_kej.asi not found. Dump of built binaries: ==="
            Get-ChildItem -Path . -Recurse -File -Include "*.asi","*.dll","*.exe" -ErrorAction SilentlyContinue |
              Select-Object FullName, Length | Format-Table -AutoSize
            throw "1_kej.asi not found anywhere in the workspace"
          }
          Write-Host "Found: $($found.FullName) ($($found.Length) bytes)"
          "ASI_PATH=$($found.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify 1_kej.asi
        shell: pwsh
        run: |
          $asi = $env:ASI_PATH
          $fs  = [System.IO.File]::OpenRead($asi)
          $br  = New-Object System.IO.BinaryReader($fs)
          try {
            # 1) DOS header: "MZ" at offset 0
            $fs.Seek(0, 'Begin') | Out-Null
            if ($br.ReadUInt16() -ne 0x5A4D) { throw "not a PE file (missing MZ)" }

            # 2) e_lfanew at 0x3C -> offset of PE header
            $fs.Seek(0x3C, 'Begin') | Out-Null
            $peOff = $br.ReadInt32()

            # 3) PE signature "PE\0\0" (0x00004550) at e_lfanew
            $fs.Seek($peOff, 'Begin') | Out-Null
            if ($br.ReadUInt32() -ne 0x00004550) { throw "not a PE file (missing PE signature)" }

            # 4) Machine right after the PE signature (e_lfanew + 4)
            $machine = $br.ReadUInt16()
          }
          finally {
            $fs.Close()
          }

          if ($machine -ne 0x14C) {
            throw "unexpected machine type 0x$($machine.ToString('X')) - expected 0x14C (x86)"
          }
          Write-Host "OK: $((Get-Item $asi).Length) bytes, PE32 x86"

      - name: Assemble package (miles/1_kej.asi + 1_kej/images)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package\miles", "package\1_kej\images" | Out-Null

          # .asi goes into miles/
          Copy-Item $env:ASI_PATH "package\miles\1_kej.asi"

          # NOTE: D3DX9_43.dll is intentionally NOT shipped.
          # Requires the DirectX End-User Runtime (June 2010) on the player's machine.
          # Download: https://www.microsoft.com/en-us/download/details.aspx?id=8109

          # menu images live in resources\1_kej\images in the repo
          if (Test-Path "resources\1_kej\images") {
            Copy-Item "resources\1_kej\images\*" "package\1_kej\images\" -Recurse -Force
          } else {
            Write-Warning "resources\1_kej\images not found - package\1_kej\images will be empty"
          }

          # warn about missing menu images (mod refuses to load without them)
          $required = @("Automation","Error_no_load","Game","Home","Jump Builder","Jump Preview","Jumping","Map","Rpg","Settings_no_load","Visuals")
          foreach ($img in $required) {
            if (-not (Get-ChildItem "package\1_kej\images" -Filter "$img.*" -ErrorAction SilentlyContinue)) {
              Write-Warning "missing menu image: 1_kej\images\$img.png (commit it under resources\1_kej\images\)"
            }
          }

          Get-ChildItem "package" -Recurse | Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1_kej-Release-x86
          path: package/
          if-no-files-found: error